<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ejercicio 1 | Notas</title><link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}"></head>
<body><main class="tarjeta"><h1>Formulario de Notas</h1><p>Ingresa tres notas entre 10 y 70 y tu asistencia.</p>
<form method="POST" action="{{ url_for('ejercicio1') }}">
{% for i in range(1, 4) %}<label for="nota{{ i }}">Nota {{ i }}:</label><input id="nota{{ i }}" name="nota{{ i }}" type="number" min="10" max="70" step="any" required value="{{ valores.get('nota' ~ i, '') }}">{% endfor %}
<label for="asistencia">Asistencia (%):</label><input id="asistencia" name="asistencia" type="number" min="0" max="100" step="any" required value="{{ valores.get('asistencia', '') }}"><button type="submit">Enviar</button></form>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
{% if resultado %}<section class="resultado" aria-live="polite"><p>Promedio: <strong>{{ resultado.promedio }}</strong></p><p>Estado: <strong>{{ resultado.estado }}</strong></p></section>{% endif %}
<a class="enlace" href="{{ url_for('inicio') }}">Volver al menú</a></main></body></html>
